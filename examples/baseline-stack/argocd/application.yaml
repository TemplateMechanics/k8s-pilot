apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: baseline
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: baseline-stack
  source:
    repoURL: https://github.com/TemplateMechanics/k8s-pilot.git
    # IMPORTANT: replace this with an immutable commit SHA or tag BEFORE
    # applying this Application. The literal value below is a placeholder
    # that Argo CD will reject — that rejection is intentional, so the
    # Application cannot be accidentally synced against a moving target.
    # See CLAUDE.md R1 / agents/argocd.agent.md for the audit-trail
    # rationale.
    targetRevision: REPLACE_WITH_COMMIT_SHA_OR_TAG_BEFORE_APPLY
    path: examples/baseline-stack/kustomize/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: baseline
  syncPolicy:
    # Manual sync by default. Enable automated.* deliberately.
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: { duration: 5s, factor: 2, maxDuration: 3m }
