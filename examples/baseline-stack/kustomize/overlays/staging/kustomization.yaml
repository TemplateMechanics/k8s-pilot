apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# tier as metadata only — see overlay dev for the immutable-selector
# rationale.
labels:
  - includeSelectors: false
    pairs:
      tier: staging

patches:
  - target: { kind: Deployment, name: baseline-web }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
