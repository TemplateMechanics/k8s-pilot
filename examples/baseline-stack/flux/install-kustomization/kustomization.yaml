# Kustomize wrapper for the Flux Kustomization reconciliation path.
# Includes the GitRepository source + Flux Kustomization CR (NOT the
# HelmRelease — use the sibling install-helmrelease/ for that
# alternative path).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../gitrepository.yaml
  - ../flux-kustomization.yaml
