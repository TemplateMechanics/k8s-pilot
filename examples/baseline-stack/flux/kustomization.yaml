apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: baseline
  namespace: flux-system
spec:
  interval: 10m
  path: ./examples/baseline-stack/kustomize/overlays/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: baseline-stack
  targetNamespace: baseline
  timeout: 5m
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: baseline-web
      namespace: baseline
