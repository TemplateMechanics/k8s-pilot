apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: baseline

# Use the modern `labels:` form with explicit includeSelectors so we
# don't accidentally bake non-selector labels into the Deployment
# selector (which is immutable in Kubernetes — changing it later
# requires delete+recreate). Service selectors ARE mutable, but keeping
# them lean still avoids accidental routing surprises. Only
# app.kubernetes.io/name belongs in the selector here (it identifies
# the app); the others are metadata.
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: baseline-web
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: baseline-stack
      app.kubernetes.io/managed-by: kustomize

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
